name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tracked files for common secret patterns
        run: python3 tools/repository_guard.py --rev HEAD
      - name: Test autosave safety behavior
        run: python3 -m unittest discover -s tests -v
      - name: Describe check coverage
        run: |
          printf '%s\n' '## Repository checks' 'Secret-pattern checks and autosave regression tests passed.' 'Application build, lint, type checking, and application tests are not configured: application source has not been received.' >> "$GITHUB_STEP_SUMMARY"
